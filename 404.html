<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#FAF9F7">
<script>
/* 与主页/博客共用主题偏好，避免深色用户看到刺眼白页 */
(function () {
  try {
    var saved = localStorage.getItem('theme');
    var theme = saved || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    document.documentElement.setAttribute('data-theme', theme);
    var m = document.querySelector('meta[name="theme-color"]');
    if (m) m.setAttribute('content', theme === 'dark' ? '#1B1C1E' : '#FAF9F7');
  } catch (e) {
    document.documentElement.setAttribute('data-theme', 'light');
  }
})();
</script>
<title>页面未找到 · 404 — retter.wang</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="icon" type="image/png" sizes="32x32" href="/favicon-32x32.png">
<link rel="icon" type="image/png" sizes="16x16" href="/favicon-16x16.png">
<link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png">
<link rel="stylesheet" href="/fonts/fonts.css">
<style>
:root{
  color-scheme:light;
  --bg:#FAF9F7;
  --surface:#F1EFE9;
  --ink:#191817;
  --muted:#6F6B64;
  --faint:#9B968D;
  --line:#E6E3DD;
  --accent:#4A5D54;
  --accent-ink:#FFFFFF;
  --serif:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong',Georgia,serif;
  --sans:'Noto Sans SC','Source Han Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
}
@media (prefers-color-scheme:dark){
  :root{
    --bg:#1B1C1E;
    --surface:#1E2023;
    --ink:#E9E7E2;
    --muted:#A9A59D;
    --faint:#8F8B83;
    --line:#34383D;
    --accent:#9FBFAB;
    --accent-ink:#12140F;
    --serif:'Noto Serif JP','Yu Mincho','YuMincho','Hiragino Mincho ProN','Noto Serif SC',Georgia,serif;
    --sans:'Noto Sans JP','Yu Gothic','YuGothic','Hiragino Sans','Noto Sans SC',sans-serif;
  }
}
/* 显式主题优先于系统偏好（由上方脚本写入 data-theme） */
:root[data-theme="light"]{
  --bg:#FAF9F7;
  --surface:#F1EFE9;
  --ink:#191817;
  --muted:#6F6B64;
  --faint:#9B968D;
  --line:#E6E3DD;
  --accent:#4A5D54;
  --accent-ink:#FFFFFF;
  --serif:'Noto Serif SC','Source Han Serif SC','Songti SC','STSong',Georgia,serif;
  --sans:'Noto Sans SC','Source Han Sans SC',-apple-system,BlinkMacSystemFont,'PingFang SC','Hiragino Sans GB','Microsoft YaHei',sans-serif;
}
:root[data-theme="dark"]{
  --bg:#1B1C1E;
  --surface:#1E2023;
  --ink:#E9E7E2;
  --muted:#A9A59D;
  --faint:#8F8B83;
  --line:#34383D;
  --accent:#9FBFAB;
  --accent-ink:#12140F;
  --serif:'Noto Serif JP','Yu Mincho','YuMincho','Hiragino Mincho ProN','Noto Serif SC',Georgia,serif;
  --sans:'Noto Sans JP','Yu Gothic','YuGothic','Hiragino Sans','Noto Sans SC',sans-serif;
}
*{box-sizing:border-box;}
html,body{height:100%;}
body{
  margin:0;
  background:var(--bg);
  color:var(--ink);
  font-family:var(--sans);
  font-size:16px;
  line-height:1.7;
  -webkit-font-smoothing:antialiased;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:clamp(24px,6vw,40px);
}
.wrap{
  width:100%;
  max-width:560px;
  text-align:center;
}
.code{
  font-family:var(--serif);
  font-size:clamp(64px,14vw,108px);
  line-height:1;
  letter-spacing:.02em;
  color:var(--accent);
  margin:0 0 .35em;
}
.title{
  font-family:var(--serif);
  font-size:clamp(20px,3.4vw,26px);
  font-weight:500;
  margin:0 0 .5em;
}
.desc{
  color:var(--muted);
  margin:0 0 2em;
  font-size:15px;
}
.hr{
  height:1px;
  background:var(--line);
  border:0;
  margin:0 0 2em;
}
.links{
  display:flex;
  gap:10px;
  justify-content:center;
  flex-wrap:wrap;
}
.btn{
  display:inline-block;
  padding:.62em 1.35em;
  border:1px solid var(--line);
  border-radius:2px;
  background:var(--surface);
  color:var(--ink);
  text-decoration:none;
  font-size:14px;
  transition:border-color .18s ease,background .18s ease;
}
.btn:hover{border-color:var(--accent);background:var(--bg);}
.btn.primary{
  background:var(--accent);
  border-color:var(--accent);
  color:var(--accent-ink);
}
.btn.primary:hover{opacity:.9;background:var(--accent);border-color:var(--accent);}
.meta{
  margin-top:2.6em;
  color:var(--faint);
  font-size:13px;
}
</style>
</head>
<body>
<main class="wrap">
  <p class="code">404</p>
  <h1 class="title">这个页面不存在</h1>
  <p class="desc">链接可能已失效，或者地址拼写有误。<br>The page you are looking for doesn't exist.</p>
  <hr class="hr">
  <nav class="links">
    <a class="btn primary" href="/">返回首页</a>
    <a class="btn" href="/blog/">个人博客</a>
  </nav>
  <p class="meta">retter.wang</p>
</main>
</body>
</html>
